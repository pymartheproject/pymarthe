# --------- Pymarthe setup file ---------
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymarthe"
authors =[
    {name = "Ryma Aissat"},
    {name = "Alexandre Pryet"},
    {name = "Pierre Matran"}
]
dynamic = ["version"]

description = "Python library for PEST-MARTHE coupling"
readme = {file = "README.md", content-type = "text/markdown"}   

# license = {file = "LICENSE"}

classifiers = [
    "Programming Language :: Python :: 3",
    #"License :: ",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
]

keywords = ["hydrology", "groundwater", "modelling", "uncertainty", "coupling", "pest", "pestpp", "marthe"]

requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.3.3,<3.0.0",
    "matplotlib>=3.8.0,<4.0",    
    "rtree>=1.4.1,<2.0.0",
    "pyshp>=3.0.3,<4.0.0",
    "pyemu>=1.3.8,<2.0.0",
    "appdirs>=1.4.4,<2.0"
]

[project.optional-dependencies]
extras = [
    "shapely>=2.1.2,<3.0.0",
    "vtk>=9.3.0,<10.0.0",
    "imageio>=2.37.0,<3.0"
]

[tool.setuptools.dynamic]
version = {attr = "pymarthe.__version__"}

[project.urls]
Repository = "https://github.com/pymartheproject/pymarthe"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["examples*", "docs*", "assets*", "presentation*"]  # exclude packages matching these glob patterns (empty by default)
