name: pymarthe-env
channels:
  - conda-forge
  - defaults

dependencies:
  # --- Python ---
  - python>=3.10

  # --- Core scientific stack (matching pyproject.toml) ---
  - numpy>=1.26.0,<3.0.0
  - pandas>=2.3.3,<3.0.0
  - matplotlib>=3.7.0,<4.0
  - rtree>=1.4.1,<2.0.0
  - pyshp>=3.0.3,<4.0.0         # nom conda-forge = pyshp
  - pyemu>=1.3.8,<2.0.0
  - appdirs>=1.4.4,<2.0.0

  # Optional but compatible packages (if you want them directly in env)
  # Otherwise install with: pip install "pymarthe[extras]"
  # - shapely>=2.1.2,<3.0.0
  # - vtk>=9.5.2,<10.0
  # - imageio>=2.37.0,<3.0

  # --- Pip support ---
  - pip

  # --- Install pymarthe from your local repo (optional) ---
  # - pip:
  #     - -e .
